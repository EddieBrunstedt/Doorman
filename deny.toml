# cargo-deny configuration. Run with `cargo deny check`.
# Scans the dependency tree for security advisories, disallowed licenses,
# banned/duplicate crates, and untrusted sources. Enforced in CI on pull
# requests and on a schedule (so newly disclosed advisories surface even
# without a code change).

[advisories]
version = 2
# Fail on crates with an open RustSec advisory or that have been yanked.
yanked = "deny"
ignore = [
  # Unmaintained, with no patched release. testcontainers pulls it into the
  # storage adapters' tests only; no doorman crate depends on it. Drop this once
  # testcontainers ships its replacement (testcontainers/testcontainers-rs#1006).
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained; reached only through testcontainers, a dev-dependency" },
  # SQLite before 3.54.0 can return stale memory from a database opened beside a
  # crafted `-wal` file. Whoever can write those files already holds the store's
  # contents. sqlx 0.9.0 caps libsqlite3-sys below 0.38, and the fix is in 0.39.
  # Drop this once sqlx allows libsqlite3-sys 0.39.
  { id = "RUSTSEC-2026-0459", reason = "needs a local attacker who can write the SQLite database files; sqlx 0.9.0 does not allow the patched libsqlite3-sys" },
  # The Marvin attack times RSA private-key operations. webauthn-rs only verifies
  # RSA signatures, with public keys. crypto-glue 0.2.2 asks rsa for a feature
  # the fixed 0.10.0 dropped, so the release candidate stays locked. Drop this
  # once crypto-glue allows rsa 0.10.0.
  { id = "RUSTSEC-2023-0071", reason = "webauthn-rs performs no RSA private-key operation; crypto-glue 0.2.2 cannot use the fixed rsa 0.10.0" },
]

[licenses]
version = 2
# doorman is dual-licensed MIT OR Apache-2.0; its dependencies must carry an
# OSI-approved permissive license.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  # Boost Software License, permissive; pulled in by xxhash-rust (via redis).
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "OpenSSL",
  # Mozilla CA root list shipped by `webpki-roots` (via sqlx/reqwest TLS).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Don't warn about allowed licenses that happen not to appear in the tree.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are a warning, not an error: the transitive graph of a
# WebAuthn + SQLx + Axum stack legitimately carries a few. Wildcard version
# requirements are rejected, except internal workspace path dependencies which
# legitimately omit a version.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
