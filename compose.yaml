# Local databases for developing and testing the storage adapters: Redis +
# Valkey for `doorman-redis`, MySQL + MariaDB for the `doorman-sqlx` mysql
# adapter.
#
# Brought up with `just up` (or `docker compose up -d --wait`). The test suite
# reads REDIS_URL / VALKEY_URL / MYSQL_URL / MARIADB_URL; the `justfile` points
# those at these services.
#
# Persistence is disabled for Redis/Valkey (`--save "" --appendonly no`): these
# are throwaway test servers, so there is no point writing snapshots or an AOF
# to disk.
services:
  redis:
    image: redis:7-alpine
    container_name: doorman-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: doorman-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8
    container_name: doorman-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doorman_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:11
    container_name: doorman-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: doorman_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
