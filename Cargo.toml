[workspace]
resolver = "2"
members = [
  "crates/axum",
  "crates/conformance",
  "crates/core",
  "crates/doorman",
  "crates/dynamodb",
  "crates/mongodb",
  "crates/redb",
  "crates/redis",
  "crates/sqlx",
  "crates/test-support",
  "examples/minimal-app",
]

[workspace.package]
version = "0.1.0"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
edition = "2024"
homepage = "https://codeberg.org/EddieBrunstedt/bauth"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/EddieBrunstedt/bauth"
# MSRV is driven by the dependency tree: sqlx 0.9 requires rustc 1.94, which is
# the highest floor among the deps (webauthn-rs/time need 1.88). Verified with
# `cargo +1.94 check --workspace --all-features`.
rust-version = "1.94"

# Shared lints applied to every crate that opts in with `[lints] workspace = true`.
# `unsafe_code` is forbidden outright — doorman never uses `unsafe`. `clippy::all`
# is denied (negative priority so item-level allows still win).
#
# `missing_docs` is deliberately NOT here: a workspace lint applies to every
# target in the package, including the test and bench crates whose `pub` helpers
# are not part of any public API. It is instead a crate-root attribute on each
# published library (currently `#![allow(missing_docs)]`, flipped to
# `#![deny(missing_docs)]` by the Phase 23 documentation rewrite), so the
# requirement scopes to the public API and never to test scaffolding.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
lru = "0.16.3"
proptest = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.5"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals", "conditional-ui"] }
webauthn-rs-proto = "0.5"

# Pinned bench profile: optimise like release but with a single codegen unit
# and fat LTO so numbers are stable run-to-run and don't drift with incremental
# codegen-unit partitioning. Documented in BENCHMARKS.md.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
