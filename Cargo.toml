[workspace]
resolver = "2"
members = ["crates/core", "crates/axum", "examples/sqlx-sqlite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eddieb/bauth"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
lru = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.5"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
