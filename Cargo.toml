[workspace]
resolver = "2"
members = [
  "crates/axum",
  "crates/conformance",
  "crates/core",
  "crates/doorman",
  "crates/dynamodb",
  "crates/mongodb",
  "crates/redb",
  "crates/redis",
  "crates/sqlx",
  "crates/test-support",
  "examples/minimal-app",
  "examples/purge",
]

[workspace.package]
version = "0.1.0"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
edition = "2024"
homepage = "https://codeberg.org/EddieBrunstedt/Doorman"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/EddieBrunstedt/Doorman"
# MSRV tracks a recent stable release rather than the dependency tree's floor.
# CI and `just msrv` enforce it against the pinned `1.99.0` toolchain
# (`cargo +1.99.0 check --workspace --all-features --locked`).
rust-version = "1.99"

# Shared lints applied to every crate that opts in with `[lints] workspace = true`.
# `unsafe_code` is forbidden outright — doorman never uses `unsafe`. `clippy::all`
# is denied (negative priority so item-level allows still win).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
proptest = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals", "conditional-ui"] }
webauthn-rs-proto = "0.5"

# Full debug info made every test binary several hundred megabytes, and the
# gigabytes written per rebuild held up the disk while the container-backed tests
# started. Line tables keep file and line in panics and backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Pinned bench profile: optimise like release but with a single codegen unit
# and fat LTO so numbers are stable run-to-run and don't drift with incremental
# codegen-unit partitioning.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
