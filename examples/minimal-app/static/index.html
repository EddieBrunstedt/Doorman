<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doorman</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d0d0f'/><path d='M5 7.4V5.4a3 3 0 0 1 6 0v2H9.5v-2a1.5 1.5 0 0 0-3 0v2H5Z' fill='%236e8bff'/><rect x='4' y='7' width='8' height='6' fill='%236e8bff'/><rect x='7.3' y='9' width='1.4' height='2.4' fill='%230d0d0f'/></svg>" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0f;
        --panel: #15151a;
        --border: #26262c;
        --text: #e7e7ea;
        --dim: #9a9aa3;
        --faint: #5b5b63;
        --accent: #6e8bff;
        --ok: #5fb87a;
        --warn: #d6a44a;
        --err: #e06c6c;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; border-radius: 0; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, p, ul { margin: 0; }
      code { font-family: var(--mono); font-size: .85em; color: #c8cbd4; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .shell { max-width: 80rem; margin: 0 auto; padding: 2rem 1.5rem; }
      header { padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
      .wordmark { font-size: 1.1rem; font-weight: 650; letter-spacing: -.01em; }
      .sub { margin-top: .15rem; color: var(--dim); font-size: .85rem; }

      .grid { display: grid; grid-template-columns: 24rem 1fr; gap: 1.5rem; align-items: start; }
      .side { display: flex; flex-direction: column; gap: 1.25rem; }
      .stack { display: flex; flex-direction: column; gap: .75rem; }
      body.signed-in .guest-only { display: none; }
      body:not(.signed-in) .auth-only { display: none; }

      .status { padding: .7rem 1rem; border: 1px solid var(--border); background: var(--panel); color: var(--dim); font-size: .85rem; }
      .status .who { color: var(--text); font-weight: 600; }
      .status .cooldown { color: var(--warn); }

      .group { display: flex; flex-direction: column; gap: .75rem; padding: 1rem; border: 1px solid var(--border); background: var(--panel); }
      .group h2 { font-size: .9rem; font-weight: 600; }
      .group .head { display: flex; align-items: center; justify-content: space-between; }

      .field { display: flex; flex-direction: column; gap: .35rem; }
      label { color: var(--dim); font-size: .8rem; }
      input {
        appearance: none;
        width: 100%;
        padding: .55rem .65rem;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: .88rem;
      }
      input::placeholder { color: var(--faint); }
      input:focus { outline: none; border-color: var(--accent); }

      .btn {
        appearance: none;
        padding: .5rem .85rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: .85rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--faint); background: #1c1c22; }
      .btn.primary { border-color: var(--text); background: var(--text); color: var(--bg); font-weight: 600; }
      .btn.primary:hover { border-color: #fff; background: #fff; }
      .btn.danger { color: var(--err); }
      .btn.danger:hover { border-color: var(--err); background: transparent; }
      .btn.block { width: 100%; }
      .btn.xs { padding: .3rem .6rem; font-size: .78rem; }
      .row { display: flex; flex-wrap: wrap; gap: .5rem; }
      .row .btn { flex: 1 1 auto; padding: .5rem .6rem; }
      hr { margin: .25rem 0; border: 0; border-top: 1px solid var(--border); }
      .hint { color: var(--faint); font-size: .8rem; }

      .list { display: flex; flex-direction: column; gap: .4rem; padding: 0; list-style: none; }
      .list:empty { display: none; }
      .list li { display: flex; align-items: center; gap: .6rem; padding: .55rem .65rem; border: 1px solid var(--border); background: var(--bg); }
      .list li.empty { color: var(--faint); font-size: .82rem; }
      .li-main { flex: 1; min-width: 0; }
      .li-main strong { display: block; font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .li-meta { display: block; margin-top: .15rem; color: var(--dim); font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .li-tag { color: var(--ok); font-size: .76rem; }

      /* ---- Trace ------------------------------------------------------- */
      .trace { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: .6rem; }
      .trace .head { display: flex; align-items: center; justify-content: space-between; }
      .trace h2 { font-size: .95rem; font-weight: 600; }
      .trace .sub { color: var(--dim); font-size: .82rem; }

      #error { padding: .55rem .7rem; border: 1px solid var(--err); border-left-width: 2px; color: #eda3a3; font-size: .84rem; }
      #error.soft { border-color: var(--border); color: var(--dim); }
      #error:empty { display: none; }

      #timeline { display: flex; flex-direction: column; gap: .75rem; max-height: calc(100vh - 9rem); overflow: auto; }
      #timeline:empty::before {
        content: "Take an action on the left — every request the page makes appears here.";
        display: block;
        padding: 2rem;
        border: 1px dashed var(--border);
        color: var(--faint);
        font-size: .84rem;
        text-align: center;
      }

      /* A flow = one action plus every request and ceremony it triggers. */
      .flow { border: 1px solid var(--border); background: var(--panel); }
      .flow.failed { border-color: rgba(224, 108, 108, .4); }
      .flow-head { display: flex; align-items: center; gap: .6rem; padding: .45rem .75rem; border-bottom: 1px solid var(--border); }
      .flow-name { font-size: .82rem; font-weight: 600; }
      .flow-state { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: .7rem; }
      .flow.done .flow-state { color: var(--ok); }
      .flow.failed .flow-state { color: var(--err); }
      .flow.aborted .flow-state { color: var(--warn); }

      /* Every step is one row: tag · what happened · status, with the caption
         always visible and any payload one click down. */
      .step { border-top: 1px solid var(--border); }
      .flow-head + .step { border-top: 0; }
      .step > summary {
        display: grid;
        grid-template-columns: 4.5rem minmax(0, 1fr) auto;
        grid-template-areas: "tag head status" "tag cap cap";
        align-items: start;
        gap: .15rem .7rem;
        padding: .5rem .75rem;
        cursor: pointer;
        list-style: none;
      }
      .step > summary::-webkit-details-marker { display: none; }
      .step > summary:hover, .step[open] > summary { background: #191920; }
      .step-tag { grid-area: tag; padding-top: .05rem; color: var(--dim); font-family: var(--mono); font-size: .68rem; }
      .step-head { grid-area: head; color: #dcdce2; font-family: var(--mono); font-size: .78rem; word-break: break-all; }
      .step-head b { margin-right: .3rem; color: var(--accent); }
      .step-status { grid-area: status; color: var(--dim); font-family: var(--mono); font-size: .72rem; white-space: nowrap; }
      .step-cap { grid-area: cap; color: var(--dim); font-size: .76rem; }
      .step-cap:empty { display: none; }

      .step.ok .step-status { color: var(--ok); }
      .step.err .step-status { color: var(--err); }
      .step.warn .step-status { color: var(--warn); }
      .step.muted .step-status { color: var(--faint); }
      .step.browser .step-tag { color: var(--accent); }
      .step.browser.err .step-status { color: var(--err); }
      .step.browser.cancelled .step-tag, .step.browser.cancelled .step-status { color: var(--warn); }

      .step-detail { display: flex; flex-direction: column; gap: .5rem; padding: 0 .75rem .6rem calc(4.5rem + .7rem); }
      .part-label { display: block; margin-bottom: .2rem; color: var(--faint); font-size: .7rem; }
      .step-detail pre {
        margin: 0;
        max-height: 16rem;
        overflow: auto;
        padding: .45rem .55rem;
        border: 1px solid var(--border);
        background: var(--bg);
        color: #b4b4be;
        font-family: var(--mono);
        font-size: .72rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .step-empty { color: var(--faint); font-family: var(--mono); font-size: .72rem; }

      .outcome { padding: .45rem .75rem; border-top: 1px solid var(--border); color: var(--ok); font-size: .8rem; }
      .outcome::before { content: "✓ "; }
      .outcome.progress { color: var(--dim); }
      .outcome.progress::before { content: "› "; color: var(--faint); }

      @media (max-width: 820px) {
        .grid { grid-template-columns: 1fr; }
        .trace { position: static; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="wordmark">doorman</div>
        <div class="sub">Passkey-only authentication for Axum.</div>
      </header>

      <main class="grid">
        <div class="side">
          <div id="status" class="status" role="status" aria-live="polite">Checking session…</div>

          <div class="group guest-only">
            <button id="signin" class="btn primary block">Sign in with a passkey</button>
            <hr />
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" value="alice@example.com" autocomplete="email" />
            </div>
            <div class="row">
              <button id="signup" class="btn block">Send signup link</button>
              <button id="recover" class="btn block">Send recovery link</button>
            </div>
            <p class="hint">Signup and recovery links print to the server terminal.</p>
          </div>

          <div class="group auth-only">
            <h2>Passkeys</h2>
            <div class="field">
              <input id="passkey-name" type="text" placeholder="New passkey name" />
            </div>
            <button id="add-passkey" class="btn primary block">Register a passkey</button>
            <ul id="passkeys" class="list" aria-label="Registered passkeys"></ul>
          </div>

          <div class="group auth-only">
            <div class="head">
              <h2>Sessions</h2>
              <button id="refresh" class="btn xs">Refresh</button>
            </div>
            <ul id="sessions" class="list" aria-label="Active sessions"></ul>
            <div class="field">
              <label id="signout-label">Sign out</label>
              <div class="row" role="group" aria-labelledby="signout-label">
                <button id="logout" class="btn">This device</button>
                <button id="revoke-others" class="btn">Other devices</button>
                <button id="logout-all" class="btn danger">Everywhere</button>
              </div>
            </div>
          </div>

          <div class="group auth-only">
            <h2>Account</h2>
            <div class="field">
              <label for="new-email">Change email</label>
              <input id="new-email" type="email" placeholder="new@example.com" autocomplete="email" />
            </div>
            <button id="change-email" class="btn block">Send confirmation link</button>
            <hr />
            <button id="delete-account" class="btn danger block">Delete account</button>
          </div>
        </div>

        <section class="trace" aria-label="Trace">
          <div class="head">
            <h2>Trace</h2>
            <button id="clear" class="btn xs">Clear</button>
          </div>
          <p class="sub">Every network request and passkey ceremony, grouped by action. <code>doorman</code> handles every <code>/auth</code> route.</p>
          <p id="error" role="alert" aria-live="assertive"></p>
          <div id="timeline" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script>
      // ---- WebAuthn encoding glue (base64url <-> ArrayBuffer) -------------
      function base64UrlToBuffer(input) {
        const padded = input.padEnd(input.length + ((4 - (input.length % 4)) % 4), "=");
        const bin = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out.buffer;
      }
      function bufferToBase64Url(buf) {
        const bytes = new Uint8Array(buf);
        let bin = "";
        for (const b of bytes) bin += String.fromCharCode(b);
        return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      function decodeCreationOptions(options) {
        const p = options.publicKey;
        return { publicKey: { ...p, challenge: base64UrlToBuffer(p.challenge), user: { ...p.user, id: base64UrlToBuffer(p.user.id) }, excludeCredentials: p.excludeCredentials?.map((c) => ({ ...c, id: base64UrlToBuffer(c.id) })) } };
      }
      function decodeRequestOptions(options) {
        const p = options.publicKey;
        return { publicKey: { ...p, challenge: base64UrlToBuffer(p.challenge), allowCredentials: p.allowCredentials?.map((c) => ({ ...c, id: base64UrlToBuffer(c.id) })) } };
      }
      function encodeAttestation(cred) {
        const r = cred.response;
        return { id: cred.id, rawId: bufferToBase64Url(cred.rawId), type: cred.type, response: { attestationObject: bufferToBase64Url(r.attestationObject), clientDataJSON: bufferToBase64Url(r.clientDataJSON) }, clientExtensionResults: cred.getClientExtensionResults() };
      }
      function encodeAssertion(cred) {
        const r = cred.response;
        return { id: cred.id, rawId: bufferToBase64Url(cred.rawId), type: cred.type, response: { authenticatorData: bufferToBase64Url(r.authenticatorData), clientDataJSON: bufferToBase64Url(r.clientDataJSON), signature: bufferToBase64Url(r.signature), userHandle: r.userHandle ? bufferToBase64Url(r.userHandle) : null }, clientExtensionResults: cred.getClientExtensionResults() };
      }

      // doorman returns stable machine codes, not end-user prose. Map them to
      // friendly guidance; the raw code stays visible in the trace.
      const ERROR_GUIDANCE = {
        recovery_cooldown_active: "Recovery cooldown is active — destructive actions are blocked for now.",
        csrf_origin_mismatch: "Origin check failed. Open the app from its configured public origin.",
        session_not_found: "You are signed out. Sign in with a passkey to continue.",
        session_expired: "Your session expired. Sign in again.",
        email_already_in_use: "That email already belongs to an account.",
        invalid_email: "Enter a valid email address.",
        invalid_verification_token: "This link is invalid or already used. Request a new one.",
        invalid_passkey_challenge: "The passkey challenge expired. Try again.",
        passkey_not_found: "The server has no record of this passkey.",
        passkey_ownership_mismatch: "That passkey belongs to another account.",
        passkey_possible_compromise: "This authenticator may be cloned. Use another passkey.",
        reauth_required: "Fresh passkey verification required. Approve the browser prompt.",
        rate_limited: "Too many attempts. Try again later.",
        resource_limit_exceeded: "This resource has reached its limit.",
        webauthn_error: "The passkey ceremony failed. Try again or use another authenticator.",
        user_not_found: "No matching account.",
      };
      const guidanceFor = (code, status) =>
        (code && ERROR_GUIDANCE[code]) ||
        (status === 401 ? ERROR_GUIDANCE.session_not_found : null) ||
        "Something went wrong. Check the server log and try again.";

      // What doorman does at each endpoint, in one line. Keyed by route
      // template; dynamic ids are normalised to `{id}`. `/api/me` has no note —
      // the `app` tag already says it is this app's own route, not doorman's.
      const REQUEST_NOTES = {
        "POST /auth/signup/request": "Mints a single-use token and emails the link. No account yet.",
        "POST /auth/signup/consume": "Token valid — returns passkey-creation options.",
        "POST /auth/signup/finish": "Verifies the new passkey, writes the account, opens a session.",
        "POST /auth/recovery/request": "Emails a link if the account exists — the reply is identical either way.",
        "POST /auth/recovery/consume": "Token valid — returns options to enroll a fresh passkey.",
        "POST /auth/recovery/finish": "New passkey stored, session opened, recovery cooldown begins.",
        "POST /auth/passkey/register/start": "Returns creation options bound to your account.",
        "POST /auth/passkey/register/finish": "Verifies the attestation, stores the new public key.",
        "POST /auth/passkey/authenticate/start": "Returns a single-use challenge for the authenticator to sign.",
        "POST /auth/passkey/authenticate/finish": "Checks the signature, finds the owner, opens a session.",
        "GET /auth/passkey": "Lists your stored passkeys.",
        "PATCH /auth/passkey/{id}": "Renames one stored credential.",
        "DELETE /auth/passkey/{id}": "Deletes one credential (needs a fresh passkey).",
        "GET /auth/sessions": "Lists your active sessions.",
        "DELETE /auth/sessions": "Revokes every session except this one.",
        "DELETE /auth/sessions/{id}": "Revokes one session.",
        "POST /auth/logout": "Drops this session and clears the cookie.",
        "POST /auth/logout-all": "Drops every session for the account.",
        "POST /auth/reauth/start": "Issues a step-up challenge before a sensitive action.",
        "POST /auth/account/email": "Emails a confirmation link to the new address (needs a fresh passkey).",
        "POST /auth/account/email/confirm": "Token valid — swaps the account's email address.",
        "DELETE /auth/account": "Erases the account, passkeys, and sessions (needs a fresh passkey).",
      };
      const CEREMONY_NOTES = {
        "navigator.credentials.create()": "The authenticator generates a key pair; the private key never leaves the device.",
        "navigator.credentials.get()": "The authenticator signs the challenge; the private key never leaves the device.",
      };
      function captionFor(method, path) {
        const key = method + " " + path
          .replace(/\/auth\/passkey\/[^/]+$/, "/auth/passkey/{id}")
          .replace(/\/auth\/sessions\/[^/]+$/, "/auth/sessions/{id}");
        return REQUEST_NOTES[key] || "";
      }

      const statusEl = document.querySelector("#status");
      const passkeysEl = document.querySelector("#passkeys");
      const sessionsEl = document.querySelector("#sessions");
      const errorEl = document.querySelector("#error");
      const timelineEl = document.querySelector("#timeline");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
      }[c]));

      // Render a server timestamp as a friendly relative phrase ("in 30 days",
      // "2 minutes ago"). The raw ISO strings the API returns are hard to read
      // and easy to misjudge as past-vs-future; this keeps the direction obvious.
      const RTF = new Intl.RelativeTimeFormat("en", { numeric: "auto", style: "short" });
      const REL_UNITS = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60], ["second", 1]];
      function relTime(iso) {
        const ms = Date.parse(iso);
        if (Number.isNaN(ms)) return escapeHtml(iso);
        const delta = (ms - Date.now()) / 1000;
        const [unit, secs] = REL_UNITS.find(([, s]) => Math.abs(delta) >= s) || REL_UNITS.at(-1);
        return RTF.format(Math.round(delta / secs), unit);
      }

      // ---- Trace ---------------------------------------------------------
      // One user action becomes a labelled flow; the requests and ceremonies
      // it triggers nest under it as identical, expandable rows.
      let currentFlow = null;
      const RANK = { running: 0, done: 1, aborted: 2, failed: 3 };
      // Auto-scroll to follow new steps, but only while the reader is already at
      // the bottom — if they have scrolled up to inspect an earlier flow, leave
      // the view where they put it.
      let stickToBottom = true;
      timelineEl.addEventListener("scroll", () => {
        stickToBottom = timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 40;
      });
      const scrollEnd = () => { if (stickToBottom) timelineEl.scrollTop = timelineEl.scrollHeight; };

      function flow(label) {
        // A new action owns the alert region: clear any error left from the
        // previous flow so the message always tracks the current action.
        errorEl.textContent = "";
        errorEl.className = "";
        const el = document.createElement("section");
        el.className = "flow running";
        el.dataset.state = "running";
        el.innerHTML = `<div class="flow-head"><span class="flow-name">${escapeHtml(label)}</span><span class="flow-state">running</span></div>`;
        timelineEl.appendChild(el);
        currentFlow = el;
        scrollEnd();
      }
      function setFlowState(state) {
        if (!currentFlow) return;
        if (RANK[state] < RANK[currentFlow.dataset.state || "running"]) return;
        currentFlow.dataset.state = state;
        currentFlow.className = `flow ${state}`;
        currentFlow.querySelector(".flow-state").textContent = state;
      }
      const appendStep = (el) => { (currentFlow || timelineEl).appendChild(el); scrollEnd(); };

      function jsonPart(label, value) {
        if (value === undefined || value === null || value === "") return "";
        const body = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        return `<div><span class="part-label">${label}</span><pre>${escapeHtml(body)}</pre></div>`;
      }
      function step(cls, tag, headHtml, status, caption, parts) {
        const det = document.createElement("details");
        det.className = `step ${cls}`;
        det.innerHTML =
          `<summary><span class="step-tag">${escapeHtml(tag)}</span>` +
          `<span class="step-head">${headHtml}</span>` +
          `<span class="step-status">${escapeHtml(status)}</span>` +
          `<span class="step-cap">${escapeHtml(caption || "")}</span></summary>` +
          `<div class="step-detail">${parts || '<span class="step-empty">no payload</span>'}</div>`;
        appendStep(det);
      }
      // Recorded for every fetch the page makes (see the wrapper below), so the
      // trace shows the whole truth — including the quiet state re-reads.
      function recordHttp(method, path, status, ok, reqBody, resBody) {
        const code = (resBody && resBody.error && resBody.error.code) || null;
        let cls = "err";
        if (ok) cls = "ok";
        else if (code === "reauth_required") cls = "warn";
        else if (code === "session_not_found" || code === "session_expired") cls = "muted";
        const tag = path.startsWith("/api/") ? "app" : "doorman";
        const head = `<b>${escapeHtml(method)}</b>${escapeHtml(path)}`;
        const label = ok ? String(status) : `${status}${code ? " · " + code : ""}`;
        step(cls, tag, head, label, captionFor(method, path), jsonPart("request", reqBody) + jsonPart("response", resBody));
      }

      function note(text) {
        errorEl.textContent = "";
        errorEl.className = "";
        const el = document.createElement("div");
        el.className = "outcome";
        el.textContent = text;
        appendStep(el);
        setFlowState("done");
      }
      function progress(text) {
        const el = document.createElement("div");
        el.className = "outcome progress";
        el.textContent = text;
        appendStep(el);
      }
      function fail(err) {
        if (err && err.cancelled) {
          setFlowState("aborted");
          errorEl.className = "soft";
          errorEl.textContent = err.message || "Cancelled.";
          return;
        }
        setFlowState("failed");
        errorEl.className = "";
        errorEl.textContent = (err && (err.message || String(err))) || "Something went wrong.";
      }

      // Wrap one user action: open a flow, run it, then settle the flow state.
      async function run(label, fn) {
        flow(label);
        try {
          await fn();
          setFlowState("done");
        } catch (err) {
          fail(err);
        }
      }

      // Run a WebAuthn ceremony so the browser's part of the dance shows up in
      // the trace, between the start and finish requests, with its outcome.
      async function ceremony(title, exec) {
        const cap = CEREMONY_NOTES[title] || "";
        let cred;
        try {
          cred = await exec();
        } catch (e) {
          // Dismissing or timing out the prompt rejects with NotAllowedError
          // (AbortError when aborted programmatically) — a cancellation, not a
          // failure. Mark it soft so the flow reads "aborted", not "failed".
          const cancelled = e && (e.name === "NotAllowedError" || e.name === "AbortError");
          step(`browser ${cancelled ? "cancelled" : "err"}`, "browser", escapeHtml(title), cancelled ? "cancelled" : "failed", cap, jsonPart("error", String(e.message || e)));
          if (cancelled) e.cancelled = true;
          throw e;
        }
        step("browser ok", "browser", escapeHtml(title), "verified", cap, jsonPart("credential", cred.id));
        return cred;
      }

      // Intercept every fetch so the trace is the complete picture, not a
      // hand-curated subset. The api() helper below only adds error handling.
      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const method = ((init && init.method) || (typeof input !== "string" && input.method) || "GET").toUpperCase();
        const url = typeof input === "string" ? input : input.url;
        let path = url;
        try { path = new URL(url, location.origin).pathname; } catch (_) {}
        let reqBody;
        if (typeof (init && init.body) === "string") {
          try { reqBody = JSON.parse(init.body); } catch (_) { reqBody = init.body; }
        }
        const res = await nativeFetch(input, init);
        let resBody = null;
        try { const t = await res.clone().text(); resBody = t ? JSON.parse(t) : null; } catch (_) {}
        recordHttp(method, path, res.status, res.ok, reqBody, resBody);
        return res;
      };

      async function api(path, method = "GET", body) {
        const res = await fetch(path, {
          method,
          credentials: "include",
          headers: body === undefined ? {} : { "content-type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const text = await res.text();
        let parsed = null;
        try { parsed = text ? JSON.parse(text) : null; } catch (_) { parsed = text; }
        if (!res.ok) {
          const code = (parsed && parsed.error && parsed.error.code) || null;
          const err = new Error(guidanceFor(code, res.status));
          err.code = code;
          err.status = res.status;
          throw err;
        }
        return parsed;
      }

      // ---- Flows ---------------------------------------------------------
      async function signIn() {
        const start = await api("/auth/passkey/authenticate/start", "POST");
        const cred = await ceremony("navigator.credentials.get()", () => navigator.credentials.get(decodeRequestOptions(start.options)));
        await api("/auth/passkey/authenticate/finish", "POST", { challenge_id: start.challenge_id, response: encodeAssertion(cred) });
        note("Signed in.");
        await refresh();
      }
      async function addPasskey() {
        const start = await api("/auth/passkey/register/start", "POST");
        const cred = await ceremony("navigator.credentials.create()", () => navigator.credentials.create(decodeCreationOptions(start.options)));
        const nameEl = document.querySelector("#passkey-name");
        const name = nameEl.value || "backup passkey";
        await api("/auth/passkey/register/finish", "POST", { challenge_id: start.challenge_id, response: encodeAttestation(cred), name });
        nameEl.value = "";
        note("Passkey registered.");
        await refresh();
      }
      async function finishEmailFlow(kind, token) {
        const start = await api(`/auth/${kind}/consume`, "POST", { token });
        const cred = await ceremony("navigator.credentials.create()", () => navigator.credentials.create(decodeCreationOptions(start.options)));
        await api(`/auth/${kind}/finish`, "POST", { challenge_id: start.challenge_id, response: encodeAttestation(cred), name: `${kind} passkey` });
        note(kind === "signup" ? "Account created — signed in." : "Recovery complete — new passkey registered.");
        await refresh();
      }
      // Sensitive actions retry once after a fresh passkey assertion when the
      // server answers `401 reauth_required`.
      async function withReauth(send) {
        try {
          return await send(undefined);
        } catch (err) {
          if (err.code !== "reauth_required") throw err;
          progress("Step-up required — verifying a passkey before this action.");
          const start = await api("/auth/reauth/start", "POST");
          const cred = await ceremony("navigator.credentials.get()", () => navigator.credentials.get(decodeRequestOptions(start.options)));
          return await send({ challenge_id: start.challenge_id, assertion: encodeAssertion(cred) });
        }
      }

      // Re-read state into the left panel. Always resolves: a signed-out read
      // is a valid outcome, not a flow failure.
      async function refresh() {
        try {
          const me = await api("/api/me");
          document.body.classList.add("signed-in");
          const count = me.user.passkey_count;
          const cooldown = me.recovery_cooldown_active ? ` · <span class="cooldown">recovery cooldown active</span>` : "";
          statusEl.innerHTML = `<span class="who">${escapeHtml(me.user.email)}</span> · ${count} passkey${count === 1 ? "" : "s"}${cooldown}`;

          const passkeys = await api("/auth/passkey");
          passkeysEl.innerHTML = passkeys.length ? passkeys.map((p) => {
            const label = escapeHtml(p.name || "Unnamed passkey");
            const sync = p.backup_state ? "synced" : (p.backup_eligible ? "sync-capable" : "device-bound");
            const last = p.last_used_at ? `last used ${relTime(p.last_used_at)}` : "never used";
            return `<li><span class="li-main"><strong>${label}</strong><span class="li-meta">${sync} · ${last}</span></span>` +
              `<button class="btn xs" data-rename="${p.credential_id}">Rename</button>` +
              `<button class="btn xs danger" data-delete="${p.credential_id}">Delete</button></li>`;
          }).join("") : `<li class="empty">No passkeys.</li>`;

          const sessions = await api("/auth/sessions");
          sessionsEl.innerHTML = sessions.length ? sessions.map((s) => {
            const device = escapeHtml(s.device_label || "Unknown device");
            const meta = `started ${relTime(s.created_at)} · expires ${relTime(s.expires_at)}`;
            const right = s.is_current
              ? `<span class="li-tag">current</span>`
              : `<button class="btn xs danger" data-revoke="${escapeHtml(s.id)}">Revoke</button>`;
            return `<li><span class="li-main"><strong>${device}</strong><span class="li-meta">${meta}</span></span>${right}</li>`;
          }).join("") : `<li class="empty">No active sessions.</li>`;
        } catch (_) {
          document.body.classList.remove("signed-in");
          statusEl.textContent = "Not signed in.";
          passkeysEl.innerHTML = "";
          sessionsEl.innerHTML = "";
        }
      }

      // ---- Wiring --------------------------------------------------------
      const emailValue = (id) => document.querySelector(id).value;

      document.querySelector("#signin").addEventListener("click", () => run("Sign in", signIn));
      document.querySelector("#add-passkey").addEventListener("click", () => run("Register a passkey", addPasskey));
      document.querySelector("#refresh").addEventListener("click", () => run("Refresh state", refresh));
      document.querySelector("#clear").addEventListener("click", () => { timelineEl.innerHTML = ""; errorEl.textContent = ""; });

      document.querySelector("#signup").addEventListener("click", () => run("Request signup link", async () => {
        await api("/auth/signup/request", "POST", { email: emailValue("#email") });
        note("Signup link sent — check the server terminal.");
      }));
      document.querySelector("#recover").addEventListener("click", () => run("Request recovery link", async () => {
        await api("/auth/recovery/request", "POST", { email: emailValue("#email") });
        note("If the account exists, a recovery link was sent — check the terminal.");
      }));

      document.querySelector("#logout").addEventListener("click", () => run("Sign out", async () => {
        await api("/auth/logout", "POST"); note("Signed out of this session."); await refresh();
      }));
      document.querySelector("#revoke-others").addEventListener("click", () => run("Sign out other sessions", async () => {
        await api("/auth/sessions", "DELETE"); note("Other sessions revoked."); await refresh();
      }));
      document.querySelector("#logout-all").addEventListener("click", () => run("Sign out everywhere", async () => {
        await api("/auth/logout-all", "POST"); note("Signed out of every session."); await refresh();
      }));

      document.querySelector("#change-email").addEventListener("click", () => run("Change email", async () => {
        const newEmail = emailValue("#new-email");
        await withReauth((reauthentication) => api("/auth/account/email", "POST", { new_email: newEmail, reauthentication }));
        note("Email-change link sent — check the terminal.");
      }));
      document.querySelector("#delete-account").addEventListener("click", () => {
        if (!window.confirm("Permanently delete this account, including all passkeys and sessions?")) return;
        run("Delete account", async () => {
          await withReauth((reauthentication) => api("/auth/account", "DELETE", reauthentication ? { reauthentication } : undefined));
          note("Account deleted.");
          await refresh();
        });
      });

      passkeysEl.addEventListener("click", (event) => {
        const rename = event.target.closest("[data-rename]");
        if (rename) {
          const name = window.prompt("New passkey name (blank clears it):");
          if (name === null) return;
          run("Rename passkey", async () => {
            await api(`/auth/passkey/${rename.dataset.rename}`, "PATCH", { name: name.trim() || null });
            note("Passkey renamed.");
            await refresh();
          });
          return;
        }
        const remove = event.target.closest("[data-delete]");
        if (!remove) return;
        run("Remove passkey", async () => {
          await withReauth((reauthentication) => api(`/auth/passkey/${remove.dataset.delete}`, "DELETE", reauthentication ? { reauthentication } : undefined));
          note("Passkey removed.");
          await refresh();
        });
      });
      sessionsEl.addEventListener("click", (event) => {
        const revoke = event.target.closest("[data-revoke]");
        if (!revoke) return;
        run("Revoke session", async () => {
          await api(`/auth/sessions/${revoke.dataset.revoke}`, "DELETE");
          note("Session revoked.");
          await refresh();
        });
      });

      async function boot() {
        const params = new URLSearchParams(window.location.search);
        const signupToken = params.get("signup_token");
        const recoveryToken = params.get("recovery_token");
        const emailChangeToken = params.get("email_change_token");
        if (signupToken || recoveryToken) {
          await run(signupToken ? "Finish signup" : "Finish recovery", () => finishEmailFlow(signupToken ? "signup" : "recovery", signupToken || recoveryToken));
          history.replaceState(null, "", "/");
          return;
        }
        if (emailChangeToken) {
          await run("Confirm email change", async () => {
            await api("/auth/account/email/confirm", "POST", { token: emailChangeToken });
            note("New email address confirmed.");
            await refresh();
          });
          history.replaceState(null, "", "/");
          return;
        }
        await run("Session check", refresh);
      }
      boot();
    </script>
  </body>
</html>
