[package]
name = "doorman-mongodb"
version.workspace = true
authors.workspace = true
categories = ["authentication", "database"]
documentation = "https://docs.rs/doorman-mongodb"
edition.workspace = true
keywords = ["authentication", "passkey", "mongodb", "nosql", "session"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MongoDB storage adapter for the doorman authentication library."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
doorman-core = { path = "../core", version = "0.1.0" }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
uuid.workspace = true

[dev-dependencies]
doorman-conformance = { path = "../conformance" }
testcontainers-modules = { version = "0.15", features = ["mongo"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
