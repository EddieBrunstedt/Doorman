[package]
name = "bauth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core authentication primitives for the bauth library: storage traits, session management, and audit events."

[features]
default = []
# Opt-in `purge::spawn_purge_task` background sweeper. Pulls tokio's runtime
# and timer so the default build stays lean.
background-purge = ["tokio/time", "tokio/rt"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[dev-dependencies]
# Test-only collaborators (mock clock, in-memory audit sink, capturing email
# sender) live in their own crate so they never reach a production build. The
# path-only edge means a `cargo publish` of bauth-core drops it.
bauth-test-support = { path = "../test-support" }
criterion.workspace = true
# `test-util` adds paused-time control for the `background-purge` task test.
tokio = { workspace = true, features = ["test-util"] }
webauthn-authenticator-rs.workspace = true

[[bench]]
name = "session"
harness = false

[[bench]]
name = "rate_limit"
harness = false

[[bench]]
name = "enrollment"
harness = false

[[bench]]
name = "passkey_auth"
harness = false
