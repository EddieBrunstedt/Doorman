[package]
name = "doorman-core"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
documentation = "https://docs.rs/doorman-core"
edition.workspace = true
keywords = ["authentication", "passkey", "webauthn", "sessions", "auth"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core authentication primitives for the doorman library: storage traits, session management, and audit events."

[features]
default = []
file-email = ["dep:tokio", "tokio/fs", "tokio/io-util"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
openssl.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
doorman-test-support = { path = "../test-support" }
proptest.workspace = true
tokio.workspace = true
