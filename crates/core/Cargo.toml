[package]
name = "doorman-core"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
documentation = "https://docs.rs/doorman-core"
edition.workspace = true
keywords = ["authentication", "passkey", "webauthn", "sessions", "auth"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core authentication primitives for the doorman library: storage traits, session management, and audit events."

[features]
default = []
# Opt-in `purge::spawn_purge_task` background sweeper. Pulls tokio's runtime
# and timer so the default build stays lean.
background-purge = ["dep:tokio", "tokio/time", "tokio/rt"]
# Bundled `FileEmailSender` dev transport that writes `.eml` files. It is the
# only thing in core's default build that needs `tokio`'s filesystem/IO, so it
# is opt-in: the default build pulls no tokio at all.
file-email = ["dep:tokio", "tokio/fs", "tokio/io-util"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# Test-only collaborators (mock clock, in-memory audit sink, capturing email
# sender) live in their own crate so they never reach a production build. The
# path-only edge means a `cargo publish` of doorman-core drops it.
criterion.workspace = true
doorman-test-support = { path = "../test-support" }
proptest.workspace = true
# `test-util` adds paused-time control for the `background-purge` task test.
tokio = { workspace = true, features = ["test-util"] }
webauthn-authenticator-rs.workspace = true

[[bench]]
name = "session"
harness = false

[[bench]]
name = "rate_limit"
harness = false

[[bench]]
name = "enrollment"
harness = false

[[bench]]
name = "passkey_auth"
harness = false
