[package]
name = "bauth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core authentication primitives for the bauth library: storage traits, session management, and audit events."

[features]
default = []
# Re-exports test-only helpers (e.g. `CapturingEmailSender`). Off by default;
# enable via `[dev-dependencies] bauth-core = { ..., features = ["testing"] }`.
testing = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio.workspace = true
webauthn-authenticator-rs.workspace = true
