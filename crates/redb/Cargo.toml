[package]
name = "doorman-redb"
version.workspace = true
authors.workspace = true
categories = ["authentication", "database"]
documentation = "https://docs.rs/doorman-redb"
edition.workspace = true
keywords = ["authentication", "passkey", "redb", "embedded", "session"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "redb embedded key-value storage adapter for the doorman authentication library."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
doorman-core = { path = "../core", version = "0.1.0" }
# Embedded B-tree database. redb enables no features by default;
# `default-features = false` keeps the optional `logging` integration off
# explicitly.
redb = { version = "4", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
doorman-conformance = { path = "../conformance" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
