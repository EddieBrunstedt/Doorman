[package]
name = "doorman-sqlx"
version.workspace = true
authors.workspace = true
categories = ["authentication", "database"]
documentation = "https://docs.rs/doorman-sqlx"
edition.workspace = true
keywords = ["authentication", "passkey", "sqlx", "sqlite", "postgres"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "SQLx-backed storage adapter for the doorman authentication library (SQLite and Postgres)."

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
doorman-core = { path = "../core", version = "0.1.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "uuid", "macros", "migrate"] }
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
doorman-conformance = { path = "../conformance" }
tokio.workspace = true

[[bench]]
name = "storage"
harness = false
required-features = ["sqlite"]
