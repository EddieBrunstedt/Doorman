[package]
name = "doorman-sqlx"
version.workspace = true
authors.workspace = true
categories = ["authentication", "database"]
documentation = "https://docs.rs/doorman-sqlx"
edition.workspace = true
keywords = ["authentication", "passkey", "sqlx", "sqlite", "postgres"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "SQLx-backed storage adapter for the doorman authentication library (SQLite, Postgres, and MySQL/MariaDB)."

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
# Covers both MySQL and MariaDB: they share the one sqlx MySql driver.
mysql = ["sqlx/mysql"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
doorman-core = { path = "../core", version = "0.1.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "uuid", "macros", "migrate"] }
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
doorman-conformance = { path = "../conformance" }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "mariadb"] }
tokio.workspace = true

[[bench]]
name = "storage"
harness = false
required-features = ["sqlite"]
