[package]
name = "bauth-sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SQLx-backed storage adapter for the bauth authentication library (SQLite and Postgres)."
keywords = ["authentication", "passkey", "sqlx", "sqlite", "postgres"]
categories = ["authentication", "database"]
documentation = "https://docs.rs/bauth-sqlx"
readme = "README.md"

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
bauth-core = { path = "../core", version = "0.1.0" }
chrono.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "uuid", "macros", "migrate"] }
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio.workspace = true

[[bench]]
name = "storage"
harness = false
required-features = ["sqlite"]
