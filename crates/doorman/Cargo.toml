[package]
name = "doorman"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
documentation = "https://docs.rs/doorman"
edition.workspace = true
keywords = ["authentication", "passkey", "webauthn", "axum", "auth"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Opinionated passkey-only authentication for Rust web apps. Umbrella crate re-exporting doorman-core, doorman-axum, doorman-sqlx, doorman-redis, doorman-dynamodb, doorman-mongodb, and doorman-redb behind features."

[features]
default = []
axum = ["dep:doorman-axum"]
sqlite = ["dep:doorman-sqlx", "doorman-sqlx/sqlite"]
postgres = ["dep:doorman-sqlx", "doorman-sqlx/postgres"]
mysql = ["dep:doorman-sqlx", "doorman-sqlx/mysql"]
redis = ["dep:doorman-redis"]
valkey = ["redis"]
dynamodb = ["dep:doorman-dynamodb"]
mongodb = ["dep:doorman-mongodb"]
redb = ["dep:doorman-redb"]
file-email = ["doorman-core/file-email", "doorman-axum?/file-email"]
purge-runner = ["dep:chrono"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, optional = true }
doorman-axum = { path = "../axum", version = "0.1.0", optional = true }
doorman-core = { path = "../core", version = "0.1.0" }
doorman-dynamodb = { path = "../dynamodb", version = "0.1.0", optional = true }
doorman-mongodb = { path = "../mongodb", version = "0.1.0", optional = true }
doorman-redb = { path = "../redb", version = "0.1.0", optional = true }
doorman-redis = { path = "../redis", version = "0.1.0", optional = true }
doorman-sqlx = { path = "../sqlx", version = "0.1.0", optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true

[package.metadata.docs.rs]
all-features = true
