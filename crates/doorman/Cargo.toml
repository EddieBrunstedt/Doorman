[package]
name = "doorman"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
documentation = "https://docs.rs/doorman"
edition.workspace = true
keywords = ["authentication", "passkey", "webauthn", "axum", "auth"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Opinionated passkey-only authentication for Rust web apps. Umbrella crate re-exporting doorman-core, doorman-axum, doorman-sqlx, and doorman-redis behind features."

[features]
default = []
# Axum HTTP integration (the supported user-facing surface).
axum = ["dep:doorman-axum"]
# SQLx storage adapters.
sqlite = ["dep:doorman-sqlx", "doorman-sqlx/sqlite"]
postgres = ["dep:doorman-sqlx", "doorman-sqlx/postgres"]
# Redis/Valkey adapter for the ephemeral stores and the shared rate limiter.
# Pair it with a SQL feature (e.g. `postgres`) — Redis cannot hold the
# system-of-record stores. `valkey` is an alias: the same code addresses either
# server, the feature only lets a host name the one it runs.
redis = ["dep:doorman-redis"]
valkey = ["redis"]
# Bundled `.eml` file email transport for local development (pulls tokio's
# filesystem support). Also enables it in `doorman-axum` when `axum` is on.
file-email = ["doorman-core/file-email", "doorman-axum?/file-email"]

[lints]
workspace = true

[dependencies]
doorman-axum = { path = "../axum", version = "0.1.0", optional = true }
doorman-core = { path = "../core", version = "0.1.0" }
doorman-redis = { path = "../redis", version = "0.1.0", optional = true }
doorman-sqlx = { path = "../sqlx", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true

[package.metadata.docs.rs]
all-features = true
