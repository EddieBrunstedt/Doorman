[package]
name = "doorman-fjall"
version.workspace = true
authors.workspace = true
categories = ["authentication", "database"]
documentation = "https://docs.rs/doorman-fjall"
edition.workspace = true
keywords = ["authentication", "passkey", "fjall", "embedded", "session"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "fjall LSM-tree embedded key-value storage adapter for the doorman authentication library."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
doorman-core = { path = "../core", version = "0.1.0" }
# Pure-Rust, LSM-tree embedded key-value store. `default-features = false` drops
# the optional LZ4 compression; no C libraries are bundled — that is the whole
# point of this adapter.
fjall = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
doorman-conformance = { path = "../conformance" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
