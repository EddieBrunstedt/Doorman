[package]
name = "bauth-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Axum HTTP integration for the bauth authentication library."

[features]
default = ["password", "passkey", "oauth", "magic_link"]
password = []
passkey = []
oauth = []
magic_link = []

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
base64.workspace = true
bauth-core = { path = "../core", version = "0.1.0" }
chrono.workspace = true
cookie = "0.18"
http = "1"
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tower = { version = "0.5", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
bauth-core = { path = "../core", version = "0.1.0" }
criterion.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "session_validate"
harness = false
