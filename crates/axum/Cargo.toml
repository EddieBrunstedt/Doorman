[package]
name = "bauth-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Axum HTTP integration for the bauth authentication library."
keywords = ["authentication", "passkey", "webauthn", "axum", "auth"]
categories = ["authentication", "web-programming::http-server"]
documentation = "https://docs.rs/bauth-axum"

[features]
default = []
# Re-export of core's bundled `.eml` file transport for local development.
# Passes through to `bauth-core/file-email` (which pulls tokio's filesystem).
file-email = ["bauth-core/file-email"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
base64.workspace = true
bauth-core = { path = "../core", version = "0.1.0" }
chrono.workspace = true
cookie = "0.18"
http = "1"
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower = { version = "0.5", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
bauth-test-support = { path = "../test-support" }
bauth-sqlx = { path = "../sqlx", version = "0.1.0", features = ["sqlite"] }
criterion.workspace = true
proptest.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true, features = ["net"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { workspace = true }
webauthn-authenticator-rs.workspace = true
webauthn-rs-proto.workspace = true

[[bench]]
name = "session_cache"
harness = false

[[bench]]
name = "request_path"
harness = false

[[bench]]
name = "concurrency"
harness = false

[[bench]]
name = "parsing"
harness = false
