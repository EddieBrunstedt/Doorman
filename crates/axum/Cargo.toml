[package]
name = "doorman-axum"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming::http-server"]
documentation = "https://docs.rs/doorman-axum"
edition.workspace = true
keywords = ["authentication", "passkey", "webauthn", "axum", "auth"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Axum HTTP integration for the doorman authentication library."

[features]
default = []
file-email = ["doorman-core/file-email"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "original-uri", "query", "tokio", "http1"] }
base64.workspace = true
chrono.workspace = true
cookie = "0.18"
doorman-core = { path = "../core", version = "0.1.0" }
http = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
async-trait.workspace = true
doorman-sqlx = { path = "../sqlx", version = "0.1.0", features = ["sqlite"] }
doorman-test-support = { path = "../test-support" }
proptest.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true, features = ["net", "test-util"] }
tower = { version = "0.5", features = ["util"] }
