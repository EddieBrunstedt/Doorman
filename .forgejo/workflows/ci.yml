# Continuous integration for doorman on Forgejo Actions (Codeberg).
#
# Most jobs run on the `docker` label (containerised). The `test` job is the
# exception: it runs on `native` because the storage-conformance tests start
# throwaway database containers via testcontainers, which need the host's
# Docker daemon — a containerised job has no Docker socket.

name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface even without a push.
    - cron: "0 6 * * 1"

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

# Shared by every job: colored cargo output and backtraces on test failures.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Static checks that never run tests: formatting, lints, and a doc build.
  lint:
    runs-on: docker
    container:
      image: rust:1.96-bookworm
    steps:
      - name: install Node.js (required by actions/checkout@v4)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  # Formatting check for the non-Rust files (Markdown, TOML, YAML, JSON).
  format:
    runs-on: docker
    container:
      image: rust:1.96-bookworm
    steps:
      - name: install deps (actions/checkout@v4 needs node; dprint installer needs curl + unzip)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs curl unzip
      - uses: actions/checkout@v4
      - name: install dprint
        run: curl -fsSL https://dprint.dev/install.sh | sh -s 0.54.0 > /dev/null
      - name: dprint check
        run: ~/.dprint/bin/dprint check

  # The full test suite, including the storage-backend conformance tests. Runs
  # on the host (`runs-on: native`) because those tests start throwaway database
  # containers via testcontainers, which need the host's Docker daemon — so the
  # runner must expose the `native` label with Docker access. Run twice to cover
  # both the default and the full feature set.
  test:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: test (default features)
        run: cargo test --workspace --locked
      - name: test (all features)
        run: cargo test --workspace --all-features --locked

  # Compile-only check of each feature combination, so a feature gate that only
  # breaks under a specific mix of features is caught without running tests.
  features:
    runs-on: docker
    container:
      image: rust:1.96-bookworm
    steps:
      - name: install Node.js (required by actions/checkout@v4)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: core (default — no tokio)
        run: cargo check -p doorman-core --locked
      - name: core (file-email)
        run: cargo check -p doorman-core --features file-email --locked
      - name: core (background-purge)
        run: cargo check -p doorman-core --features background-purge --locked
      - name: core (all features)
        run: cargo check -p doorman-core --all-features --locked
      - name: sqlx (sqlite)
        run: cargo check -p doorman-sqlx --features sqlite --locked
      - name: sqlx (postgres)
        run: cargo check -p doorman-sqlx --features postgres --locked
      - name: sqlx (mysql)
        run: cargo check -p doorman-sqlx --features mysql --locked
      - name: redis
        run: cargo check -p doorman-redis --locked
      - name: dynamodb
        run: cargo check -p doorman-dynamodb --locked
      - name: umbrella (axum + sqlite)
        run: cargo check -p doorman --features axum,sqlite --locked
      - name: umbrella (axum + mysql)
        run: cargo check -p doorman --features axum,mysql --locked
      - name: umbrella (axum + postgres + file-email)
        run: cargo check -p doorman --features axum,postgres,file-email --locked
      - name: umbrella (axum + postgres + redis — the mixed-backend path)
        run: cargo check -p doorman --features axum,postgres,redis --locked
      - name: umbrella (axum + dynamodb)
        run: cargo check -p doorman --features axum,dynamodb --locked
      - name: benches compile
        run: cargo bench --workspace --all-features --no-run --locked

  # Verifies the crate still builds on its minimum supported Rust version. Pinned
  # to the declared `rust-version` 1.94 (driven by sqlx 0.9); keep the two in sync.
  msrv:
    runs-on: docker
    container:
      image: rust:1.94-bookworm
    steps:
      - name: install Node.js (required by actions/checkout@v4)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: check on MSRV
        run: cargo check --workspace --all-features --locked

  # Dependency policy gate: license, advisory, and ban checks via cargo-deny.
  deny:
    runs-on: docker
    container:
      image: rust:1.96-bookworm
    steps:
      - name: install Node.js (required by actions/checkout@v4)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny check
