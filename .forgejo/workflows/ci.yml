# Continuous integration for doorman on Forgejo Actions (Codeberg).
#
# The runner is a self-hosted machine exposed under the `native` label. It
# already carries most of the toolchain — a rustup with the stable and 1.94
# toolchains, dprint, cargo-deny, and a Docker daemon for the testcontainers
# conformance tests. The one tool the pipeline installs itself is cargo-rdme
# (pinned below): keeping it self-contained means the README-sync check never
# assumes a runner has it pre-baked. `cargo install` is idempotent, so it builds
# once on a cold cache and is a fast no-op on every run after. Otherwise it runs
# the host tools directly and reuses one warm build cache, instead of the old
# design that recompiled the whole dependency tree from a cold cache in a fresh
# container for every job (and rebuilt dprint and cargo-deny from source each
# run).

name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface even without a push. Only
    # `audit` runs on this trigger; `ci` skips it (see its `if`).
    - cron: "0 6 * * 1"

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Everything that needs the project to compile, in one job so the steps share
  # a single warm target directory rather than recompiling per job. Ordered
  # cheap-first: formatting and lints fail in seconds; the container-backed test
  # suite runs last. Skipped on the weekly cron — that trigger only re-scans
  # advisories via `audit`.
  ci:
    if: ${{ forgejo.event_name != 'schedule' }}
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      # Build into a persistent path outside the workspace so the cache survives
      # checkout's `git clean` between runs (and keeps the multi-gigabyte target
      # dir out of the repo tree, where git and dprint would otherwise scan it).
      - name: shared build cache
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/doorman-ci/target" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all --check
      - name: dprint (Markdown/TOML/YAML/JSON)
        run: dprint check
      # Pinned so CI and a contributor's local cargo-rdme generate identical
      # output (a version skew would make `--check` fail spuriously). Keep this
      # in sync with the version you run locally.
      - name: install cargo-rdme (pinned)
        run: cargo install cargo-rdme --version 2.0.0 --locked
      - name: cargo-rdme (README in sync with crate docs)
        run: cargo rdme --workspace-project doorman --readme-path README.md --intralinks-strip-links --heading-base-level 0 --check
      # Drives the feature-powerset check below. Like cargo-rdme: `cargo install`
      # is idempotent, so it builds once on a cold cache and no-ops afterwards.
      - name: install cargo-hack
        run: cargo install cargo-hack --locked

      - name: clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      # Feature-combination builds. clippy above already compiles every target
      # with *all* features on, so this only covers what that configuration
      # hides: the default build (no features, no tokio) and the `#[cfg(feature)]`
      # gating that only shows when a feature is enabled alone or paired with
      # another. `--depth 2` covers every feature pair of the 11-feature umbrella
      # without the full 2^11 powerset (see the justfile `check-features` recipe);
      # doorman-sqlx's three driver features get a full powerset.
      - name: build — default features (whole workspace)
        run: cargo check --workspace --locked
      - name: build — feature powerset (umbrella, depth 2)
        run: cargo hack check -p doorman --feature-powerset --depth 2 --locked
      - name: build — feature powerset (sqlx drivers)
        run: cargo hack check -p doorman-sqlx --feature-powerset --locked

      # Minimum supported Rust version; keep `1.94` in sync with `rust-version`
      # in the workspace manifest. A compile check, not a test run.
      - name: msrv (1.94)
        run: cargo +1.94.1 check --workspace --all-features --locked

      # The real correctness gate: the full suite with every backend enabled,
      # which starts throwaway databases through testcontainers (hence the Docker
      # daemon on the native runner). Last because it is the slowest step.
      - name: test (all features)
        run: cargo test --workspace --all-features --locked

  # Dependency policy: licenses, RustSec advisories, banned/duplicate crates.
  # Split out because it compiles none of the project, so the weekly cron can
  # surface freshly disclosed advisories without rerunning the whole pipeline.
  audit:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        run: cargo deny check
